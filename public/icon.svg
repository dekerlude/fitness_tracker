<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium background gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#18181c" />
    </linearGradient>
    
    <!-- Push/Pull/Legs high contrast accent colors -->
    <linearGradient id="push-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="pull-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="legs-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- High-contrast dark background with a crisp border -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#27272a" stroke-width="6" />

  <!-- Dumbbell shaft -->
  <rect x="120" y="240" width="272" height="32" rx="10" fill="#a1a1aa" />
  <rect x="230" y="240" width="52" height="32" fill="#d4d4d8" />

  <!-- Outer Plates (Push / Blue) -->
  <rect x="96" y="160" width="24" height="192" rx="12" fill="url(#push-grad)" />
  <rect x="392" y="160" width="24" height="192" rx="12" fill="url(#push-grad)" />

  <!-- Mid Plates (Pull / Emerald) -->
  <rect x="64" y="192" width="24" height="128" rx="8" fill="url(#pull-grad)" />
  <rect x="424" y="192" width="24" height="128" rx="8" fill="url(#pull-grad)" />

  <!-- Inner Plates (Legs / Amber) -->
  <rect x="32" y="216" width="24" height="80" rx="6" fill="url(#legs-grad)" />
  <rect x="456" y="216" width="24" height="80" rx="6" fill="url(#legs-grad)" />

  <!-- Branding text below design -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">PPL TRACKER</text>
  <text x="256" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#3b82f6" text-anchor="middle" letter-spacing="6">ATHLETIC BODY</text>
</svg>
